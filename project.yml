# XcodeGen manifest. The .xcodeproj is generated, never committed.
#   xcodegen generate
name: TamaPoke

options:
  bundleIdPrefix: com.allenst486db
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    # Upstream firmware C++ is vendored verbatim; it is not warning-clean by
    # Xcode's standards and we do not want to patch it (keeps submodule bumps free).
    GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    # Free personal provisioning: set your own prefix here or via `xcodegen`
    # after editing. Must be globally unique for a free Apple ID to sign it.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  # ---------------------------------------------------------------- iOS app
  TamaPoke:
    type: application
    platform: iOS
    sources:
      - path: Sources/Core
      - path: Sources/Shared
      - path: Sources/iOS
      # See upstream-expanded/README.md: pet.cpp/i18n.cpp come from a
      # separate community fork now, not upstream/ -- only one `class Pet`
      # definition can be compiled in, and the fork's is a superset that adds
      # the Personality/Daily/Box pages and Pokedex filter.
      - path: upstream-expanded/pet.cpp
        group: upstream-expanded
      - path: upstream-expanded/i18n.cpp
        group: upstream-expanded
      # TPK2 sprites, copied in by Scripts/fetch_sprites.sh. A folder reference
      # so they land as mons/ inside the bundle, and optional because they are
      # gitignored -- a fresh checkout (and every CI build) has none, and must
      # still build. See README "Sprites".
      - path: Resources/mons
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: TamaPokeWatch
        embed: true
    preBuildScripts:
      - path: Scripts/ensure_app_icon.sh
        name: Ensure app icon
        outputFiles:
          - $(SRCROOT)/Sources/iOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenst486db.itamapoke
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/iOS/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/TamaPoke-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/Core
          # Listed before upstream/ so "pet.h"/"i18n.h"/"dex.h"/"audio.h"
          # resolve to the fork's versions -- see upstream-expanded/README.md.
          - $(SRCROOT)/upstream-expanded
          - $(SRCROOT)/upstream
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  # ------------------------------------------------------------ watchOS app
  # Single-target watchOS app (watchOS 7+ style), embedded in the iOS app so a
  # single sideloaded .ipa carries both.
  TamaPokeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Core
      - path: Sources/Shared
      - path: Sources/watchOS
      # See upstream-expanded/README.md: pet.cpp/i18n.cpp come from a
      # separate community fork now, not upstream/ -- only one `class Pet`
      # definition can be compiled in, and the fork's is a superset that adds
      # the Personality/Daily/Box pages and Pokedex filter.
      - path: upstream-expanded/pet.cpp
        group: upstream-expanded
      - path: upstream-expanded/i18n.cpp
        group: upstream-expanded
      # Same sprite folder as the iOS app. Both bundles carry their own copy --
      # a watchOS app cannot read the phone app's resources, and this one runs
      # standalone (WKRunsIndependentlyOfCompanionApp), so it needs its own.
      - path: Resources/mons
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      - path: Scripts/ensure_app_icon.sh
        name: Ensure app icon
        outputFiles:
          - $(SRCROOT)/Sources/watchOS/Assets.xcassets/AppIcon.appiconset/AppIcon.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenst486db.itamapoke.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/watchOS/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/TamaPoke-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/Core
          # Listed before upstream/ so "pet.h"/"i18n.h"/"dex.h"/"audio.h"
          # resolve to the fork's versions -- see upstream-expanded/README.md.
          - $(SRCROOT)/upstream-expanded
          - $(SRCROOT)/upstream
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO

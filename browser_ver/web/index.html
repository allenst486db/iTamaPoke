<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iTamaPoke (browser build)</title>
<style>
  html, body { margin: 0; height: 100%; background: #10131a; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { touch-action: none; image-rendering: pixelated; max-width: 100vw; max-height: 100vh; }
  #status {
    position: fixed; left: 0; right: 0; bottom: 0;
    font: 11px/1.4 -apple-system, system-ui, sans-serif; color: #8a93a6;
    text-align: center; padding: 4px 0; pointer-events: none;
  }
  #spriteLoad, #dexEntryLoad {
    position: fixed; top: 8px;
    font: 11px -apple-system, system-ui, sans-serif;
    background: #1c2030; color: #cdd4e0; border: 1px solid #333a4d;
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  #spriteLoad { right: 8px; }
  #dexEntryLoad { right: 8px; top: 42px; }
  #spriteLoad:active, #dexEntryLoad:active { background: #262b3f; }
  #spriteInput, #dexEntryInput { display: none; }
</style>
</head>
<body>
<canvas id="tp" width="466" height="466"></canvas>
<div id="status">loading…</div>
<button id="spriteLoad" type="button">Load sprites…</button>
<input id="spriteInput" type="file" accept=".bin" multiple>
<button id="dexEntryLoad" type="button">Load dex text…</button>
<input id="dexEntryInput" type="file" accept=".txt" multiple>
<script src="tp_core.js"></script>
<script src="sprites.js"></script>
<script src="audio.js"></script>
<script src="minigames.js"></script>
<script src="dexentry.js"></script>
<script src="dex.js"></script>
<script src="battle.js"></script>
<script src="card.js"></script>
<script src="expedition.js"></script>
<script src="ceremony.js"></script>
<script src="main.js"></script>
</body>
</html>

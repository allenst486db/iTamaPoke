<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iTamaPoke</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#10131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iTamaPoke">
<!-- Stamped with the commit id by the deploy workflow, and shown under the
     game. An installed web app can sit on a cached copy for a while, so
     having the build visible is the difference between "the fix didn't
     work" and "this phone is still on the old build". -->
<meta name="tp-build" content="__BUILD__">
<style>
  html, body { margin: 0; height: 100%; background: #10131a; overscroll-behavior: none; }
  /* Toolbar above the game, game centred in what's left, status under it --
     nothing floats over the play area. */
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  /* No text selection / long-press callout anywhere: the release dialog is
     opened by holding the creature for 3 s, and iOS otherwise treats that
     hold as "select" and pops its magnifier/menu over the game. */
  body, canvas, #toolbar, #status {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas {
    touch-action: none; image-rendering: pixelated;
    width: min(100vw, calc(100vh - 110px), 466px); height: auto; aspect-ratio: 1;
  }
  #status {
    font: 11px/1.4 -apple-system, system-ui, sans-serif; color: #8a93a6;
    text-align: center; padding: 0 12px; pointer-events: none; min-height: 1.4em;
  }
  #build {
    font: 10px -apple-system, system-ui, sans-serif; color: #4a5163;
    text-align: center; pointer-events: none;
  }
  #toolbar {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    width: min(100vw - 16px, 466px); padding: 6px 0 0;
  }
  .tool {
    font: 12px -apple-system, system-ui, sans-serif;
    background: #1c2030; color: #cdd4e0; border: 1px solid #333a4d;
    border-radius: 8px; padding: 8px 4px; cursor: pointer; white-space: nowrap;
  }
  .tool:active { background: #262b3f; }
  .tool.danger { color: #e08a8a; }
  #spriteInput, #dexEntryInput, #cryInput, #saveInput { display: none; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="spriteLoad" class="tool" type="button">Load sprites…</button>
  <button id="dexEntryLoad" class="tool" type="button">Load dex text…</button>
  <button id="cryLoad" class="tool" type="button">Load cries…</button>
  <button id="saveExport" class="tool" type="button">Save file…</button>
  <button id="saveImport" class="tool" type="button">Load save…</button>
  <button id="gameReset" class="tool danger" type="button">Reset game…</button>
</div>
<input id="spriteInput" type="file" accept=".bin" multiple>
<input id="dexEntryInput" type="file" accept=".txt" multiple>
<input id="cryInput" type="file" accept=".m4a,.mp3,.wav,.ogg" multiple>
<input id="saveInput" type="file" accept=".tpsave,.bin,application/octet-stream">
<canvas id="tp" width="466" height="466"></canvas>
<div id="status">loading…</div>
<div id="build"></div>
<script>
// Surface any startup failure in the status line instead of a silent
// "loading…" -- on a phone there is no console to look at.
window.addEventListener("error", (e) => {
  const s = document.getElementById("status");
  if (s) s.textContent = "error: " + (e.message || e.error || "unknown") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "");
});
window.addEventListener("unhandledrejection", (e) => {
  const s = document.getElementById("status");
  const r = e.reason;
  if (s) s.textContent = "error: " + (r && (r.message || r.toString())) ;
});
</script>
<script src="tp_core.js"></script>
<script src="sprites.js"></script>
<script src="thumbs.js"></script>
<script src="icons.js"></script>
<script src="scene.js"></script>
<script src="behaviour.js"></script>
<script src="audio.js"></script>
<script src="minigames.js"></script>
<script src="dexentry.js"></script>
<script src="cry.js"></script>
<script src="dex.js"></script>
<script src="battle.js"></script>
<script src="card.js"></script>
<script src="expedition.js"></script>
<script src="ceremony.js"></script>
<script src="main.js"></script>
<script>
// Offline install (see sw.js). Only registers on https:// or localhost --
// the browser refuses it anywhere else, and a plain dev server is fine
// without it. A new version is fetched in the background and used from
// the *next* launch. Deliberately no reload when it takes over: on the
// very first launch the worker installs a few seconds in, and reloading
// then threw away whatever the player had just done (the starter pick
// was the visible casualty -- it hadn't reached IndexedDB yet).
{
  // The placeholder is only ever replaced by the deploy workflow, so an
  // id still wrapped in underscores means this is an unstamped local copy.
  // Tested for by shape rather than by literal: writing the placeholder
  // out here would make sed replace this comparison too, and every deploy
  // would then report itself as local.
  const b = document.querySelector('meta[name="tp-build"]');
  const id = b ? b.content : "";
  const stamped = id && !/^__.*__$/.test(id);
  document.getElementById("build").textContent = stamped ? `build ${id}` : "build: local";
}
if ("serviceWorker" in navigator) {
  // Was this launch already controlled by a worker? If not, this is a first
  // install and the reload below must not fire -- it used to, and threw
  // away whatever had been done in the seconds before the worker finished
  // installing (the starter pick, most visibly).
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();   // a new version took over: run it, don't
                                // keep executing the copy already in memory
  });
  navigator.serviceWorker.register("sw.js").then((reg) => {
    // An installed PWA can stay resident for days, and iOS only checks for
    // a new worker on its own schedule -- so ask, on launch and whenever
    // the app comes back to the foreground. Without this a fix can sit
    // deployed and unseen indefinitely.
    const check = () => { reg.update().catch(() => {}); };
    check();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") check();
    });
  }).catch((e) => console.warn("[sw] register failed:", e));
}
// Belt and braces for the long-press: the CSS above stops selection, this
// stops the context menu / callout the browser may still try to show.
const tpCanvas = document.getElementById("tp");
tpCanvas.addEventListener("contextmenu", (e) => e.preventDefault());
tpCanvas.addEventListener("touchstart", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#8a93a6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="250" rx="18" fill="#faf5ea" stroke="#e6dcc8" stroke-width="2"/>
  <text x="24" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" font-weight="bold" fill="#8a93a6" text-anchor="start">PATH A, END TO END</text>
  <rect x="24" y="52" width="254" height="66" rx="12" fill="#ffffff" stroke="#e2a33d" stroke-width="2"/>
  <path d="M25 65 L25 105" stroke="#e2a33d" stroke-width="5" stroke-linecap="round"/>
  <text x="155.0" y="80.16666666666667" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="14" font-weight="bold" fill="#2b3550" text-anchor="middle">1. Download the .ipa</text>
  <text x="155.0" y="99.16666666666667" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="12" font-weight="normal" fill="#8a93a6" text-anchor="middle">Actions → Build (unsigned)</text>
  <path d="M282 85 L312 85" fill="none" stroke="#8a93a6" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="316" y="52" width="254" height="66" rx="12" fill="#ffffff" stroke="#e2a33d" stroke-width="2"/>
  <path d="M317 65 L317 105" stroke="#e2a33d" stroke-width="5" stroke-linecap="round"/>
  <text x="447.0" y="80.16666666666667" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="14" font-weight="bold" fill="#2b3550" text-anchor="middle">2. Install the tool</text>
  <text x="447.0" y="99.16666666666667" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="12" font-weight="normal" fill="#8a93a6" text-anchor="middle">Sideloadly or AltStore</text>
  <path d="M574 85 L604 85" fill="none" stroke="#8a93a6" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="608" y="52" width="254" height="66" rx="12" fill="#ffffff" stroke="#e2a33d" stroke-width="2"/>
  <path d="M609 65 L609 105" stroke="#e2a33d" stroke-width="5" stroke-linecap="round"/>
  <text x="739.0" y="80.16666666666667" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="14" font-weight="bold" fill="#2b3550" text-anchor="middle">3. Sign and install</text>
  <text x="739.0" y="99.16666666666667" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="12" font-weight="normal" fill="#8a93a6" text-anchor="middle">with your own Apple ID</text>
  <rect x="24" y="152" width="254" height="66" rx="12" fill="#ffffff" stroke="#e2a33d" stroke-width="2"/>
  <path d="M25 165 L25 205" stroke="#e2a33d" stroke-width="5" stroke-linecap="round"/>
  <text x="155.0" y="180.16666666666666" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="14" font-weight="bold" fill="#2b3550" text-anchor="middle">4. Trust the developer</text>
  <text x="155.0" y="199.16666666666666" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="12" font-weight="normal" fill="#8a93a6" text-anchor="middle">Settings → General → VPN &amp; Device</text>
  <path d="M282 185 L312 185" fill="none" stroke="#8a93a6" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="316" y="152" width="254" height="66" rx="12" fill="#ffffff" stroke="#e2a33d" stroke-width="2"/>
  <path d="M317 165 L317 205" stroke="#e2a33d" stroke-width="5" stroke-linecap="round"/>
  <text x="447.0" y="180.16666666666666" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="14" font-weight="bold" fill="#2b3550" text-anchor="middle">5. Add the mons folder</text>
  <text x="447.0" y="199.16666666666666" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="12" font-weight="normal" fill="#8a93a6" text-anchor="middle">Files → On My iPhone → iTamaPoke</text>
  <path d="M574 185 L604 185" fill="none" stroke="#8a93a6" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="608" y="152" width="254" height="66" rx="12" fill="#ffffff" stroke="#e05c5c" stroke-width="2"/>
  <path d="M609 165 L609 205" stroke="#e05c5c" stroke-width="5" stroke-linecap="round"/>
  <text x="739.0" y="180.16666666666666" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="14" font-weight="bold" fill="#2b3550" text-anchor="middle">6. Renew every 7 days</text>
  <text x="739.0" y="199.16666666666666" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',monospace" font-size="12" font-weight="normal" fill="#8a93a6" text-anchor="middle">free Apple IDs expire</text>
</svg>

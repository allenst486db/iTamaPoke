name: Build (unsigned)

# Produces an UNSIGNED .ipa, for people WITHOUT a paid Apple Developer account.
# It is not installable as-is: sign it with your own free Apple ID via
# AltStore/SideStore (see README "Installing"). CI cannot do free personal
# provisioning -- that flow requires an interactive Apple ID sign-in and has no
# API-key equivalent.
#
# If you DO have a paid Apple Developer Program membership, use
# "Build (signed)" (build-signed.yml) instead: it emits a ready-to-install .ipa
# and is the only path that installs the watch app reliably.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not `macos-latest`: this project vendors firmware C++ through a
    # shim layer, so a silent Xcode bump is more likely to break it than to help.
    # Bump deliberately when you want a newer toolchain.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          # The upstream firmware is a pinned submodule; the C++ game logic is
          # compiled from it verbatim.
          submodules: recursive

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iOS|watchOS' || true

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      # Compiled first: it is the cheaper target and fails fast on anything
      # wrong in the shared C++ bridge or the SwiftUI renderer.
      - name: Build watchOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project TamaPoke.xcodeproj \
            -scheme TamaPokeWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Archive iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TamaPoke.xcodeproj \
            -scheme TamaPoke \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TamaPoke.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      # An .ipa is just a zip with the .app under Payload/. Signing tools
      # (AltStore, SideStore, Sideloadly) re-sign this on the way to the device.
      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP="build/TamaPoke.xcarchive/Products/Applications/TamaPoke.app"
          test -d "$APP" || { echo "::error::archive produced no .app at $APP"; exit 1; }
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # A missing watch app is a build regression, not a footnote: the whole
          # point of embedding it is that one sideloaded .ipa carries both apps.
          WATCH="build/Payload/TamaPoke.app/Watch/TamaPokeWatch.app"
          test -d "$WATCH" || { echo "::error::watch app was not embedded at $WATCH"; exit 1; }
          ( cd build && zip -qry TamaPoke-unsigned.ipa Payload )
          {
            echo "### Built \`TamaPoke-unsigned.ipa\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Size | $(du -h build/TamaPoke-unsigned.ipa | cut -f1) |"
            echo "| iOS binary | $(lipo -info build/Payload/TamaPoke.app/TamaPoke | sed 's/.*: //') |"
            echo "| Watch app | embedded ($(lipo -info "$WATCH/TamaPokeWatch" | sed 's/.*: //')) |"
            echo
            echo "Unsigned. Sign it with your own Apple ID before installing -- see README \"Installing\"."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-unsigned-ipa
          path: build/TamaPoke-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
